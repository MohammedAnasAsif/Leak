<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Leak</title>
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #0c1626; color: #e8edf3; font: 16px/1.5 system-ui, sans-serif; text-align: center; padding: 2rem; }
  h1 { font-size: 1.5rem; margin: 0 0 .5rem; }
  p { color: #a9b6c8; margin: 0 0 1.5rem; }
  button { font: 600 1rem system-ui; border: 0; border-radius: 999px; padding: .75rem 1.25rem; background: #ffd23f; color: #10213a; cursor: pointer; }
</style>
</head>
<body>
  <main>
    <h1>Leak can't reach the news right now</h1>
    <p>Check your connection. Stories you've opened before still work once Leak loads.</p>
    <button type="button" onclick="history.back(); setTimeout(function(){ location.reload() }, 300)">Try again</button>
  </main>
</body>
</html>
