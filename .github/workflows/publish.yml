# Fetches every feed, groups stories, and publishes the site to GitHub Pages.
# Runs every 5 minutes for free (public repos get unlimited Actions minutes).
name: Publish news

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "engine/**"
      - "web/**"
      - "config/**"
      - "Cargo.lock"
      - ".github/workflows/publish.yml"

permissions:
  contents: read
  pages: write
  id-token: write
  actions: write

# One run at a time, so state is never written by two runs at once.
concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - id: pages
        uses: actions/configure-pages@v5

      # The engine is compiled once and reused until its code changes (~2 min saved per run).
      - name: Restore engine binary
        id: bin
        uses: actions/cache@v4
        with:
          path: bin/leak
          key: leak-bin-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'engine/**') }}

      - name: Build engine
        if: steps.bin.outputs.cache-hit != 'true'
        run: |
          cargo build --release --locked
          mkdir -p bin && cp target/release/leak bin/leak

      # Stories, articles and feed health carry over between runs.
      - name: Restore state
        uses: actions/cache/restore@v4
        with:
          path: state
          key: leak-state-${{ github.run_id }}
          restore-keys: leak-state-

      - name: Fetch, group and render
        env:
          LEAK_BASE_URL: ${{ steps.pages.outputs.base_url }}
          # Optional free distribution channels. Add any of these as repository secrets.
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          BLUESKY_HANDLE: ${{ secrets.BLUESKY_HANDLE }}
          BLUESKY_APP_PASSWORD: ${{ secrets.BLUESKY_APP_PASSWORD }}
          MASTODON_INSTANCE: ${{ secrets.MASTODON_INSTANCE }}
          MASTODON_TOKEN: ${{ secrets.MASTODON_TOKEN }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: ./bin/leak run --distribute

      - name: Save state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: state
          key: leak-state-${{ github.run_id }}-${{ github.run_attempt }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - id: deploy
        uses: actions/deploy-pages@v4

      # GitHub pauses scheduled workflows after 60 days without repository activity.
      # Re-enabling once a day keeps the news flowing even when nobody commits.
      - name: Keep the schedule alive
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$(date -u +%H)" = "00" ] && [ "$(date -u +%M)" -lt 6 ]; then
            gh api -X PUT "repos/${{ github.repository }}/actions/workflows/publish.yml/enable" || true
          fi
