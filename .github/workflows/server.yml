name: Server image + deploy

# Builds the Leak news server (which also serves the website) as a Docker
# image on GitHub Container Registry: ghcr.io/<owner>/leak:latest
# If the FLY_API_TOKEN secret is set, it is also deployed to Fly.io (fly.toml).

on:
  push:
    branches: [main]
    paths:
      - "server/**"
      - "web/**"
      - "Dockerfile"
      - "fly.toml"
      - ".github/workflows/server.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-fly:
    needs: image
    runs-on: ubuntu-latest
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Skip notice
        if: env.FLY_API_TOKEN == ''
        run: echo "::notice::FLY_API_TOKEN not set; skipping Fly.io deploy. The Docker image on GHCR can run on any host."
      - uses: superfly/flyctl-actions/setup-flyctl@master
        if: env.FLY_API_TOKEN != ''
      - name: Deploy
        if: env.FLY_API_TOKEN != ''
        run: flyctl deploy --remote-only
