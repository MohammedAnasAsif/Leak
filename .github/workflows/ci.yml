name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    name: News engine (test + release build)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: server
      - name: Test
        working-directory: server
        run: cargo test --locked
      - name: Release build
        working-directory: server
        run: cargo build --release --locked
      - uses: actions/upload-artifact@v4
        with:
          name: leak-server-linux-x64
          path: server/target/release/leak

  app-check:
    name: App shell compiles
    # Windows runner: the webview ships with the OS, so no system packages are needed.
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri
      - name: cargo check
        working-directory: app/src-tauri
        run: cargo check --locked
