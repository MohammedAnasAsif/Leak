name: CI

on:
  pull_request:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "*.md"

jobs:
  engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --check
      - name: Lint
        run: cargo clippy --release --locked -- -D warnings
      - name: Test
        run: cargo test --release --locked
      - name: Build the demo site
        run: cargo run --release --locked -- --out demo-site demo
      - uses: actions/upload-artifact@v4
        with:
          name: demo-site
          path: demo-site
          retention-days: 7

