# ──────────────────── GDELT global firehose ───────────────────
# GDELT monitors news in 100+ languages from almost every country,
# updated every 15 minutes. These sweeps catch stories from outlets
# we have no feed for. Syntax: https://blog.gdeltproject.org/gdelt-doc-2-0-api-debuts/
[[gdelt]]
category = "world"
query = '(earthquake OR explosion OR attack OR ceasefire OR "state of emergency" OR evacuation) sourcelang:english'
[[gdelt]]
category = "politics"
query = '(election OR parliament OR president OR "prime minister" OR sanctions) sourcelang:english'
[[gdelt]]
category = "finance"
query = '(stocks OR "central bank" OR inflation OR "interest rates" OR earnings OR bitcoin) sourcelang:english'
[[gdelt]]
category = "tech"
query = '("artificial intelligence" OR startup OR cybersecurity OR smartphone OR semiconductor) sourcelang:english'
[[gdelt]]
category = "climate"
query = '(wildfire OR hurricane OR cyclone OR flood OR heatwave OR "climate change") sourcelang:english'
