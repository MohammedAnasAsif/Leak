# Every source Leak watches. Add, remove or re-categorise freely.
# category must be one of: world, politics, finance, tech, science, health,
#                          sports, entertainment, climate
# fast = true  -> polled every `fast_poll_secs` (wires and breaking desks).
# Feeds that advertise a WebSub hub switch to instant push automatically
# when LEAK_PUBLIC_URL is set to the server's public https address.
# Check live health of every feed at  GET /api/sources

[settings]
poll_secs = 60
fast_poll_secs = 20
gdelt_secs = 120
max_articles = 6000
concurrency = 48
max_age_hours = 48
enrich_images = true

