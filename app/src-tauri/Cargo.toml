[package]
name = "leak-app"
version = "0.1.0"
description = "Leak — live world news for Windows, Android and iOS"
edition = "2021"
license = "MIT"

# The `_lib` name keeps Windows from clashing the lib and the bin outputs.
[lib]
name = "leak_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
