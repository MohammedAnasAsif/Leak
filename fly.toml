# Fly.io deployment for the Leak server (https://fly.io).
# One-time setup:  fly launch --no-deploy --copy-config   (pick a unique app name)
# Then add FLY_API_TOKEN as a GitHub secret and every push to main deploys.
app = "leak-news"
primary_region = "bom"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"
  # Set to your public URL to switch WebSub-capable feeds to instant push:
  # LEAK_PUBLIC_URL = "https://leak-news.fly.dev"

[http_service]
  internal_port = 8080
  force_https = true
  # Keep one machine running: the engine must stay awake to catch news.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
