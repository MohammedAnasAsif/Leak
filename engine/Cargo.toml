[package]
name = "leak"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Leak news engine: fetches, clusters and publishes world news as a static site"
default-run = "leak"

[dependencies]
anyhow = "1"
axum = "0.8"
blake3 = "1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive", "env"] }
feed-rs = "2"
futures = "0.3"
html-escape = "0.2"
minijinja = { version = "2", features = ["loader", "urlencode", "json"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "gzip", "brotli", "deflate", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "sync", "fs", "signal"] }
tokio-stream = { version = "0.1", features = ["sync"] }
toml = "0.8"
tower-http = { version = "0.6", features = ["fs", "compression-gzip", "set-header"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"
