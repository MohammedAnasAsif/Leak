# Leak sources. Public RSS/Atom feeds only.
#
# Fields:
#   name     Outlet name shown to readers
#   url      Feed URL (https://…) or a local file (file:path/to/feed.xml) for testing
#   section  Default section for items from this feed ("world" lets keywords decide)
#   country  ISO 3166 code of where the outlet is based
#   region   Africa | Americas | Asia | Europe | Middle East | Oceania | Global
#   weight   0.5–1.5. Higher = preferred headline when several outlets cover a story
#
# Feeds that fail are skipped and listed on the site's status page, so a dead
# URL never breaks a build. To add a source, open a pull request (see docs/SOURCES.md).

