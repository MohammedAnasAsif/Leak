# Leak site configuration.
# Everything a fork needs to change lives in this file and sources.toml.

name = "Leak"
tagline = "World news, the moment it breaks."
description = "Open-source world news wire. Every story, every outlet, updated every few minutes. No ads, no tracking, no account."
# Overridden at build time by --base-url (CI passes the GitHub Pages URL).
base_url = "http://localhost:8080"
repo_url = "https://github.com/MohammedAnasAsif/Leak"
language = "en"

# How long stories stay on the site (and keep working links).
retention_hours = 168
# Feed items older than this when we first see them are ignored.
max_item_age_hours = 36
# A new article can only join a story that was updated within this window.
cluster_window_hours = 36
fetch_concurrency = 24
fetch_timeout_secs = 12
user_agent = "LeakBot/0.1 (+https://github.com/MohammedAnasAsif/Leak; open-source news aggregator)"

# Distribution bots (Telegram, Bluesky, Mastodon, ntfy) only post stories
# that meet these bars. Credentials come from environment variables.
[distribution]
min_sources = 3
max_posts_per_run = 3
max_story_age_minutes = 180

# Sections, in navigation order. Keywords route stories from general feeds.
[[sections]]
id = "world"
name = "World"
color = "#2457D6"
keywords = []

